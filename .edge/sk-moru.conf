# config/nginx/conf.d/sk-moru.conf
# sk.moru.my — S-Kids (서울형 키즈카페 통합 검색 데모) 엣지 라우팅
#
# 인증서: newsroom-moru-wildcard (*.moru.my). moru.my 인증서 SAN에 sk.moru.my
# 추가는 LE HTTP-01 fetch 차단 확인(2026-10-14) 후 다시 시도할 것.
# 백엔드: s-kids 컨테이너 (도커 브리지 게이트웨이 172.17.0.1:8123).
# 컨테이너명을 static upstream으로 쓰지 않아 컨테이너 정지 시 nginx [emerg] 방지.

server {
    listen 80;
    server_name sk.moru.my;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name sk.moru.my;

    ssl_certificate /etc/letsencrypt/live/newsroom-moru-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/newsroom-moru-wildcard/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass http://172.17.0.1:8123;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }
}
