# AirCanvas Kids 콘텐츠 서버 Nginx 설정
# 사용법: nginx -c /path/to/nginx.conf

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Gzip 압축
    gzip on;
    gzip_types text/plain application/json image/svg+xml;

    # 캐시 헤더 설정
    map $request_uri $cache_control {
        default "public, max-age=3600";
        "~/manifest.json$" "public, max-age=300, must-revalidate";
        "~/artworks/thumbnails/" "public, max-age=86400";
    }

    server {
        listen 8081;
        server_name localhost;

        root /srv/aircanvas/content-server;
        index manifest.json;

        # CORS 헤더 (폰 앱에서 fetch 가능하도록)
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type";

        # OPTIONS 요청 처리
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type";
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }

        # 매니페스트 - 짧은 캐시
        location = /manifest.json {
            add_header Cache-Control "public, max-age=300, must-revalidate";
            add_header Content-Type application/json;
        }

        # 썸네일 이미지 - 긴 캐시
        location /artworks/thumbnails/ {
            add_header Cache-Control "public, max-age=86400";
            try_files $uri =404;
        }

        # 아트워크 데이터
        location /artworks/data/ {
            add_header Cache-Control "public, max-age=3600";
            try_files $uri =404;
        }

        # 기본
        location / {
            try_files $uri $uri/ =404;
        }

        # 헬스체크
        location /health {
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }
}