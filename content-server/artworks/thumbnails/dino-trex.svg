<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="title desc">
  <title id="title">티라노사우루스</title>
  <desc id="desc">귀엽고 씩씩한 아기 티라노사우루스</desc>
  <defs>
    <linearGradient id="sky-trex" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fee8d6"/>
      <stop offset="1" stop-color="#fcd5b4"/>
    </linearGradient>
    <radialGradient id="sun" cx="20%" cy="20%" r="50%">
      <stop stop-color="#fff9e6"/>
      <stop offset="1" stop-color="#ffd166"/>
    </radialGradient>
  </defs>
  <rect width="200" height="200" rx="32" fill="url(#sky-trex)"/>
  <circle cx="160" cy="40" r="22" fill="url(#sun)" opacity="0.8"/>
  <path d="M0 152 Q50 140 100 154 T200 150 V200 H0 Z" fill="#70a961"/>
  <path d="M0 166 Q60 158 120 168 T200 164 V200 H0 Z" fill="#588b4c"/>
