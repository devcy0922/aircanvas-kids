# 월드 캐릭터 행동 프리셋. 작품 yml의 `behavior:`가 이름으로 고르거나 값을 덮어쓴다.
#   habitat  ground(땅 위를 걷기) | sky(하늘을 날기) | water(물속을 헤엄치기)
#   size     몸집 배율        speed [최소, 최대] 이동 속도     stepHz 걸음/날갯짓 빈도
#   bob 상하 흔들림  lean 기울기  roll 좌우 흔들림  leg 다리 스윙  tail 꼬리 스윙  tailHz 꼬리 빈도  head 고개  wing 날개 스윙
#   altitude [위, 아래] 나는 높이(장면 y 0~128, 생략하면 위쪽 하늘 12~38)
#   neck     고개 들기 배율(목이 긴 친구)   dust  true면 걸음마다 먼지가 일어남   shout  roar/trumpet 때 띄우는 글자
#   moves    [[행동, 가중치], ...]  행동: walk idle roar graze look wag charge pounce trumpet fly glide swoop swim breach
# 새 프리셋은 여기에 한 줄 추가하면 된다(앱 코드 수정 없음). 새 "행동 종류" 자체는 worldEngine.ts에 있어야 한다.
trex:     {habitat: ground, size: 1,    speed: [9, 12],  stepHz: 1.7, bob: 2.4, lean: 2,   roll: 2.4, leg: 9,  tail: 6,  tailHz: 0.8, head: 2.5, wing: 0,  dust: true, shout: 크아앙!, moves: [[walk, 0.45], [roar, 0.3], [look, 0.25]]}
brachio:  {habitat: ground, size: 1.05, speed: [4, 6],   stepHz: 0.9, bob: 1.2, lean: 0.5, roll: 1.2, leg: 5,  tail: 5,  tailHz: 0.5, head: 4,   wing: 0,  neck: 16, moves: [[walk, 0.45], [graze, 0.35], [look, 0.2]]}
stego:    {habitat: ground, size: 0.95, speed: [5, 7],   stepHz: 1.3, bob: 1.4, lean: 0.8, roll: 4,   leg: 7,  tail: 12, tailHz: 1.6, head: 3,   wing: 0,  moves: [[walk, 0.5], [wag, 0.3], [graze, 0.2]]}
