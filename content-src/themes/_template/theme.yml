# 새 테마 만들기: 이 폴더를 복사해서 폴더 이름을 테마 id로 바꾼다 (예: cp -r _template sky).
# 폴더 이름은 소문자·숫자·하이픈이고, 이 안의 작품 id(파일 이름)는 "<테마id>-"로 시작해야 한다 (예: sky-balloon).
# `_`로 시작하는 폴더는 빌드가 무시한다. 값은 python3 tools/art/build_content.py --check 로 검증한다.
label: 하늘            # 테마 이름 (칩·버튼에 표시)
order: 4               # 테마 순서 (작을수록 앞)
emoji: ☁️              # 테마 아이콘
tagline: 구름 위 산책   # 부제
bgColor: "#eaf6ff"     # 테마 칩 배경
accentColor: "#2f7fc1" # 강조색 (글자·버튼)
world:
  title: 높고 푸른 하늘
  lead: 구름 사이로 내 친구가 반짝 나타났어요. 화면이나 친구를 눌러 보세요!
  # scene: generic 이면 아래 palette/ambient로 장면이 그려진다(코드 수정 없음).
  #        dino | jungle | ocean 은 앱에 들어 있는 전용 장면을 쓴다.
  scene: generic
  palette:             # 모두 #rrggbb
    skyTop: "#5ab4ee"      # 하늘 위쪽
    skyBottom: "#e9f7ff"   # 하늘 아래쪽
    groundTop: "#ffffff"   # 바닥(구름바다·풀밭) 위쪽
    groundBottom: "#cfe6f7"
    hill: "#f4fbff"        # 먼 언덕/구름 더미
    sun: "#ffe27a"         # 선택: 해(없으면 안 그림)
  ambient: clouds      # none | clouds | stars | bubbles | petals  (배경에 떠다니는 것)
  spawn:               # 내가 칠한 친구가 나타나는 연출
    prop: cloud            # egg | bush | bubble | cloud | star
    colors: ["#ffffff", "#bfe3ff", "#ffe27a"]   # 나타날 때 터지는 반짝이 색
    # shell: true          # egg일 때 알 껍데기 조각도 튄다
  tapEmojis: ["☁️", "🎈", "⭐", "💖"]   # 화면을 누르면 떠오르는 것
