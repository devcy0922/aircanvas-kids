# 엄빠(서울형 키즈카페) 데모 배포 (cy-server)
#
#   docker compose -f apps/cafe/docker-compose.yml up -d --build   # 기동
#   docker compose -f apps/cafe/docker-compose.yml ps               # 상태 확인
#   docker compose -f apps/cafe/docker-compose.yml logs -f kids-cafe
#   docker compose -f apps/cafe/docker-compose.yml down             # 중단
#
# 컨테이너명: kids-cafe, 포트: 8124 (이관 전 s-kids 컨테이너는 8123 — 전환 완료 전까지 공존)
# 공개 경로: https://kids.aircanvas.kr/cafe/  (엣지 nginx가 /cafe/ 접두를 떼고 이 포트로 프록시)
services:
  kids-cafe:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    container_name: kids-cafe
    image: kids-cafe:demo
    ports:
      - "8124:8124"
    environment:
      - PORT=8124
      - TZ=Asia/Seoul
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8124/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
