<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#12231d" />
    <meta name="description" content="아이와 함께 놀고, 함께 갈 곳을 고르는 AirCanvas Kids" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🦖%3C/text%3E%3C/svg%3E" />
    <title>AirCanvas Kids</title>
    <script>
      // 예전 QR·공유 링크(/?room=…&server=…)는 게임으로 보낸다. 쿼리는 그대로 전달한다.
      (function () {
        if (/[?&](room|server|content|phoneApp|debug)=/.test(location.search)) {
          location.replace('/play/' + location.search + location.hash);
        }
      })();
    </script>
  </head>
  <body>
    <main class="portal" id="portal">
      <header class="portal__bar">
        <span class="portal__brand">AirCanvas Kids</span>
      </header>

      <section class="portal__hero">
        <h1>아이와 오늘<br />뭐 하지?</h1>
        <p>함께 놀 것도, 함께 갈 곳도 여기서 골라요.</p>
      </section>

      <ul class="portal__services" id="services" aria-label="서비스 목록"></ul>

      <footer class="portal__foot">
        <p>카메라 영상은 기기 밖으로 보내지 않아요.</p>
        <p class="portal__version" id="version"></p>
      </footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
