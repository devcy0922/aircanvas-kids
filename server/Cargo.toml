[package]
name = "aircanvas-relay"
version = "0.1.0"
edition = "2021"
description = "AirCanvas Kids 좌표 릴레이 서버 (폰↔TV WebSocket 매칭)"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.6", features = ["cors"] }
rand = "0.8"

[profile.release]
lto = true
codegen-units = 1
