<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>S-Kids — 서울형 키즈카페 찾기</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link rel="stylesheet" as="style" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>
  :root {
    --bg: #FAF7F2; --card: #FFFFFF; --ink: #26221E; --muted: #8A8177;
    --line: #EDE7DE; --coral: #FF6B4A; --coral-soft: #FFEDE7;
    --teal: #0FA38F; --teal-soft: #E3F5F1;
    --ok: #1FA96C; --ok-soft: #E4F6EC;
    --full: #E5484D; --full-soft: #FDEBEC;
    --notopen: #2E7DFF; --notopen-soft: #E9F1FF;
    --closed: #7D8592; --closed-soft: #EEF1F4;
    --unknown: #E8930C; --unknown-soft: #FFF4E2;
    --stale: #8B5CF6;
    --r-lg: 20px; --r-md: 14px;
    --shadow: 0 1px 2px rgba(38,34,30,.04), 0 6px 18px rgba(38,34,30,.06);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Pretendard", -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    padding-bottom: calc(24px + env(safe-area-inset-bottom));
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 16px; }

  /* ── 상단 앱바 ── */
  .appbar {
    position: sticky; top: 0; z-index: 20;
    background: rgba(250,247,242,.92); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
    padding: 12px 0 10px;
  }
  .appbar .wrap { display: flex; align-items: center; gap: 8px; }
  .logo { width: 34px; height: 34px; border-radius: 11px; background: linear-gradient(135deg, var(--coral), #FFB25A);
    display: grid; place-items: center; font-size: 19px; box-shadow: var(--shadow); }
  .brand { font-size: 17px; font-weight: 800; letter-spacing: -.3px; }
  .brand small { display: block; font-size: 11px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
  .demo-pill { margin-left: auto; font-size: 10.5px; font-weight: 700; color: var(--unknown);
    background: var(--unknown-soft); border: 1px solid #F5DCA8; padding: 4px 9px; border-radius: 999px; }

  /* ── 데모 안내 배너 (닫기 가능) ── */
  .demo-banner { margin: 12px 0 0; background: var(--unknown-soft); border: 1px solid #F5DCA8;
    color: #8A5A00; border-radius: var(--r-md); padding: 10px 12px; font-size: 12px; line-height: 1.55;
    display: flex; gap: 8px; align-items: flex-start; }
  .demo-banner button { margin-left: auto; flex: none; border: 0; background: transparent; color: #8A5A00;
    font-size: 15px; cursor: pointer; line-height: 1; padding: 2px; }

  /* ── 날짜 스트립 ── */
  .section-label { font-size: 12px; font-weight: 700; color: var(--muted); margin: 16px 0 8px;
    display: flex; align-items: center; gap: 8px; }
  .section-label .right { margin-left: auto; font-weight: 500; }
  .date-strip { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .date-strip::-webkit-scrollbar { display: none; }
  .date-chip { flex: none; min-width: 64px; border: 1.5px solid var(--line); background: var(--card);
    border-radius: var(--r-md); padding: 8px 10px; text-align: center; cursor: pointer;
    transition: all .15s; }
  .date-chip .dow { font-size: 11px; font-weight: 600; color: var(--muted); }
  .date-chip .dom { font-size: 15px; font-weight: 800; margin-top: 1px; }
  .date-chip.on { border-color: var(--coral); background: var(--coral-soft); }
  .date-chip.on .dow { color: var(--coral); }
  .date-chip.today .dom::after { content: ""; }
  .date-chip .tag { display: inline-block; font-size: 9px; font-weight: 800; background: var(--coral);
    color: #fff; border-radius: 5px; padding: 1px 4px; margin-left: 3px; vertical-align: 2px; }

  /* ── 위치 · 반경 ── */
  .loc-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .loc-btn { border: 1.5px solid var(--line); background: var(--card); border-radius: 999px;
    padding: 7px 13px; font-size: 12.5px; font-weight: 600; cursor: pointer; display: flex;
    align-items: center; gap: 6px; color: var(--ink); transition: all .15s; }
  .loc-btn.on { border-color: var(--teal); background: var(--teal-soft); color: var(--teal); }
  .seg { display: inline-flex; background: #F1ECE4; border-radius: 999px; padding: 3px; }
  .seg button { border: 0; background: transparent; border-radius: 999px; padding: 5px 11px;
    font-size: 12px; font-weight: 700; color: var(--muted); cursor: pointer; }
  .seg button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(38,34,30,.12); }
  .seg.disabled { opacity: .45; pointer-events: none; }

  /* ── 자치구 · 나이 칩 ── */
  .chip-row { display: flex; gap: 7px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .chip-row::-webkit-scrollbar { display: none; }
  .chip { flex: none; border: 1.5px solid var(--line); background: var(--card); border-radius: 999px;
    padding: 6px 13px; font-size: 12.5px; font-weight: 600; color: var(--ink); cursor: pointer;
    transition: all .15s; white-space: nowrap; }
  .chip.on { border-color: var(--coral); background: var(--coral-soft); color: #D14A2E; font-weight: 700; }

  /* ── 결과 요약 행 ── */
  .result-bar { display: flex; align-items: baseline; gap: 8px; margin-top: 18px; }
  .result-bar .count { font-size: 16px; font-weight: 800; }
  .result-bar .sub { font-size: 12px; color: var(--muted); }

  /* ── 시설 카드 ── */
  .cards { display: grid; gap: 14px; margin-top: 10px; }
  .card { background: var(--card); border-radius: var(--r-lg); box-shadow: var(--shadow);
    overflow: hidden; border: 1px solid var(--line); }
  .card-top { height: 92px; display: flex; align-items: flex-end; padding: 12px; position: relative; }
  .card-top .emoji { position: absolute; right: 10px; bottom: 6px; font-size: 40px; opacity: .9; }
  .card-top h2 { margin: 0; font-size: 16.5px; font-weight: 800; letter-spacing: -.3px;
    display: flex; align-items: center; gap: 7px; flex-wrap: wrap; color: #fff; text-shadow: 0 1px 6px rgba(0,0,0,.25); }
  .badge { font-size: 10.5px; font-weight: 800; border-radius: 999px; padding: 3px 8px; }
  .badge.dist { background: rgba(255,255,255,.92); color: var(--ink); }
  .card-body { padding: 12px 14px 14px; }
  .meta-line { font-size: 12.5px; color: var(--muted); line-height: 1.6; }
  .meta-line .age-ok { color: var(--ok); font-weight: 700; }
  .meta-line .age-warn { color: var(--unknown); font-weight: 700; }
  .sess-title { font-size: 11.5px; font-weight: 700; color: var(--muted); margin: 10px 0 6px; }
  .sessions { display: flex; gap: 7px; flex-wrap: wrap; }
  .sess { border-radius: 11px; padding: 7px 10px; font-size: 11.5px; font-weight: 700; flex: 1;
    min-width: 86px; text-align: center; line-height: 1.35; }
  .sess small { display: block; font-weight: 500; font-size: 10.5px; opacity: .85; }
  .s-AVAILABLE { background: var(--ok-soft); color: var(--ok); }
  .s-FULL { background: var(--full-soft); color: var(--full); }
  .s-NOT_OPEN { background: var(--notopen-soft); color: var(--notopen); }
  .s-CLOSED { background: var(--closed-soft); color: var(--closed); }
  .s-UNKNOWN { background: var(--unknown-soft); color: var(--unknown); }
  .card-foot { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
  .checked { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 4px; }
  .checked.stale { color: var(--stale); font-weight: 700; }
  .btn-refresh { border: 1.5px solid var(--line); background: #fff; border-radius: 999px;
    padding: 6px 11px; font-size: 11.5px; font-weight: 700; color: var(--muted); cursor: pointer; }
  .btn-refresh:disabled { opacity: .5; }
  .btn-official { margin-left: auto; border: 0; background: var(--teal); color: #fff;
    border-radius: 999px; padding: 9px 15px; font-size: 12.5px; font-weight: 800;
    text-decoration: none; display: inline-flex; align-items: center; gap: 4px;
    box-shadow: 0 3px 10px rgba(15,163,143,.3); transition: transform .1s; }
  .btn-official:active { transform: scale(.97); }
  .btn-official.weak { background: #9AA3AD; box-shadow: none; }

  /* ── 로딩 / 빈 상태 ── */
  .skel { height: 170px; border-radius: var(--r-lg);
    background: linear-gradient(100deg, #F1ECE4 40%, #FAF6F0 50%, #F1ECE4 60%);
    background-size: 200% 100%; animation: sh 1.2s infinite; }
  @keyframes sh { to { background-position: -200% 0; } }
  .empty { text-align: center; padding: 56px 0 40px; color: var(--muted); }
  .empty .big { font-size: 44px; }
  .empty p { margin: 10px 0 0; font-size: 13.5px; line-height: 1.6; }

  footer { margin-top: 34px; font-size: 11px; color: var(--muted); line-height: 1.7;
    border-top: 1px solid var(--line); padding-top: 14px; }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--coral); outline-offset: 2px; }

  @media (min-width: 720px) {
    .cards { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>

<header class="appbar">
  <div class="wrap">
    <div class="logo">🧸</div>
    <div class="brand">S-Kids<small>서울형 키즈카페 통합 검색</small></div>
    <span class="demo-pill">DEMO</span>
  </div>
</header>

<div class="wrap">
  <div class="demo-banner" id="demoBanner" role="note">
    <span>📌 데모입니다. 시설·현황 수치는 예시(시뮬레이션)이며 실제 예약 정보가 아닙니다. 예약·결제는 서울시 공식 포털에서만 진행됩니다.</span>
    <button id="bannerClose" aria-label="안내 닫기">✕</button>
  </div>

  <!-- 날짜 -->
  <div class="section-label">이용 날짜 <span class="right" id="dateLabel"></span></div>
  <div class="date-strip" id="dateStrip"></div>

  <!-- 위치 · 반경 -->
  <div class="section-label">위치</div>
  <div class="loc-row">
    <button class="loc-btn" id="locBtn" type="button"><span id="locIcon">📍</span><span id="locText">내 위치 사용</span></button>
    <div class="seg disabled" id="radiusSeg">
      <button data-r="" class="on">전체</button>
      <button data-r="1">1km</button>
      <button data-r="3">3km</button>
      <button data-r="5">5km</button>
      <button data-r="10">10km</button>
    </div>
  </div>

  <!-- 자치구 -->
  <div class="section-label">자치구 <span class="right" id="distCount"></span></div>
  <div class="chip-row" id="districtRow"></div>

  <!-- 아이 나이 -->
  <div class="section-label">아이 나이</div>
  <div class="chip-row" id="ageRow"></div>

  <!-- 결과 -->
  <div class="result-bar" id="resultBar" hidden>
    <span class="count" id="resCount"></span>
    <span class="sub" id="resSub"></span>
  </div>
  <div class="cards" id="list"></div>

  <footer>
    S-Kids는 비공식 검색 도구입니다. 예약·대기·이용 조건의 최종 기준은
    <a href="https://umppa.seoul.go.kr" target="_blank" rel="noopener">서울시 우리동네키움포털</a>이며,
    표시된 수치는 '실시간 확보'를 의미하지 않습니다.<br>
    시설현황 데이터: 서울 열린데이터광장 (공공누리 제1유형 — 출처 표기). 데모 데이터는 예시입니다.
  </footer>
</div>

<script>
'use strict';
const $ = (id) => document.getElementById(id);
const KST_MIN = 9 * 60;
const DOW = ['일', '월', '화', '수', '목', '금', '토'];
const GRADIENTS = [
  ['linear-gradient(135deg,#FF9A76,#FF6B4A)', '🏰'],
  ['linear-gradient(135deg,#4FD1C5,#0FA38F)', '🎈'],
  ['linear-gradient(135deg,#7FA8FF,#4B6BFF)', '🧩'],
  ['linear-gradient(135deg,#F7C06A,#E8930C)', '🦊'],
  ['linear-gradient(135deg,#B490FF,#7C4DFF)', '🌈'],
  ['linear-gradient(135deg,#63D487,#1FA96C)', '🐢'],
];

let districts = [];
let selected = new Set();
let loc = null;
let radius = '';
let ageChip = null;      // null | 0..11(세) | '10+'
let state = { date: kstDate(new Date()) };

function kstDate(d) {
  const t = new Date(d.getTime() + KST_MIN * 60000);
  return t.toISOString().slice(0, 10);
}
function parseYMD(s) { return new Date(s + 'T12:00:00'); }

/* ── 데모 배너 ── */
if (sessionStorage.getItem('sk-banner-hidden')) $('demoBanner').remove();
$('bannerClose')?.addEventListener('click', () => {
  sessionStorage.setItem('sk-banner-hidden', '1');
  $('demoBanner').remove();
});

/* ── 날짜 스트립: 오늘 + 8일 ── */
(function buildDates() {
  const strip = $('dateStrip');
  const today = kstDate(new Date());
  const addDays = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return kstDate(d); };
  const entries = [{ d: today, label: '오늘', tag: true }, { d: addDays(1), label: '내일', tag: true }];
  for (let i = 2; i <= 8; i++) entries.push({ d: addDays(i), label: null });
  entries.forEach((e, i) => {
    const dt = parseYMD(e.d);
    const dow = DOW[dt.getDay()];
    const dom = `${dt.getMonth() + 1}.${String(dt.getDate()).padStart(2, '0')}`;
    const c = document.createElement('button');
    c.type = 'button'; c.className = 'date-chip' + (i === 0 ? ' on today' : '');
    c.dataset.date = e.d;
    c.innerHTML = `<span class="dow">${e.label || dow}</span><span class="dom">${dom}${i < 2 ? '<i class="tag">★</i>' : ''}</span>`;
    c.addEventListener('click', () => {
      strip.querySelectorAll('.date-chip').forEach((x) => x.classList.remove('on'));
      c.classList.add('on');
      state.date = e.d;
      search();
    });
    strip.appendChild(c);
  });
  $('dateLabel').textContent = state.date;
})();

/* ── 위치 · 반경 ── */
$('radiusSeg').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  radius = b.dataset.r;
  $('radiusSeg').querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b));
  search();
});
$('locBtn').addEventListener('click', () => {
  if (!navigator.geolocation) { $('locText').textContent = '위치 API 미지원'; return; }
  $('locText').textContent = '위치 확인 중…';
  navigator.geolocation.getCurrentPosition(
    (p) => {
      loc = { lat: p.coords.latitude, lng: p.coords.longitude };
      $('locBtn').classList.add('on');
      $('locText').textContent = `위치 사용 중 ${loc.lat.toFixed(2)}, ${loc.lng.toFixed(2)}`;
      $('radiusSeg').classList.remove('disabled');
      search();
    },
    () => {
      $('locText').textContent = '거부됨 — 자치구 기준 거리';
      $('locBtn').classList.remove('on');
    }
  );
});

/* ── 자치구 칩 ── */
async function initDistricts() {
  const r = await fetch('/api/districts');
  districts = (await r.json()).districts;
  const row = $('districtRow');
  const all = document.createElement('button');
  all.type = 'button'; all.className = 'chip on'; all.textContent = '전체';
  all.addEventListener('click', () => {
    selected.clear();
    row.querySelectorAll('.chip').forEach((c) => c.classList.toggle('on', c === all));
    search();
  });
  row.appendChild(all);
  districts.forEach((d) => {
    const c = document.createElement('button');
    c.type = 'button'; c.className = 'chip'; c.textContent = d;
    c.addEventListener('click', () => {
      if (selected.has(d)) selected.delete(d); else selected.add(d);
      c.classList.toggle('on');
      all.classList.toggle('on', selected.size === 0);
      $('distCount').textContent = selected.size ? `${selected.size}개 선택` : '';
      search();
    });
    row.appendChild(c);
  });
}

/* ── 나이 칩 ── */
(function buildAges() {
  const row = $('ageRow');
  const opts = [{ v: null, t: '미지정' }, ...Array.from({ length: 10 }, (_, i) => ({ v: i, t: `${i}세` })), { v: '10+', t: '10세 이상' }];
  opts.forEach((o, i) => {
    const c = document.createElement('button');
    c.type = 'button'; c.className = 'chip' + (i === 0 ? ' on' : '');
    c.textContent = o.t; c.dataset.v = String(o.v);
    c.addEventListener('click', () => {
      ageChip = o.v;
      row.querySelectorAll('.chip').forEach((x) => x.classList.toggle('on', x === c));
      search();
    });
    row.appendChild(c);
  });
})();
function ageMonths() {
  if (ageChip === null) return null;
  if (ageChip === '10+') return 120;
  return ageChip * 12;
}

/* ── 검색 ── */
const list = $('list');
function skeleton(n = 4) {
  list.innerHTML = '';
  for (let i = 0; i < n; i++) { const s = document.createElement('div'); s.className = 'skel'; list.appendChild(s); }
}

const STATUS_TEXT = { AVAILABLE: '가능', FULL: '마감', NOT_OPEN: '예약 전', CLOSED: '휴관', UNKNOWN: '확인 불가' };

function ageLine(f) {
  const range = f.age_range ? `이용연령 ${f.age_range}` : '이용연령 확인 필요';
  if (f.age_eligibility === 'eligible') return `<span class="age-ok">✓ 나이 적합</span> · ${range}`;
  if (f.age_eligibility === 'review') return `<span class="age-warn">! 연령 확인 필요</span> · ${range}`;
  return range;
}

function checkedKst(iso) {
  return new Date(iso).toLocaleTimeString('ko-KR', { timeZone: 'Asia/Seoul', hour: '2-digit', minute: '2-digit' }) + ' 확인';
}

function renderCard(f, date) {
  const [g, emoji] = GRADIENTS[[...f.facility_id].reduce((a, c) => a + c.charCodeAt(0), 0) % GRADIENTS.length];
  const a = f.availability;
  const dist = f.distance_km == null ? '거리 미제공' : `${f.distance_km} km`;
  const el = document.createElement('article');
  el.className = 'card';
  el.innerHTML = `
    <div class="card-top" style="background:${g}">
      <h2>${f.name}<span class="badge dist">${f.district} · ${dist}</span></h2>
      <span class="emoji">${emoji}</span>
    </div>
    <div class="card-body">
      <div class="meta-line">${ageLine(f)}<br>${f.open_days} · ${f.address}</div>
      <div class="sess-title">${date} 회차별 현황</div>
      <div class="sessions" id="sess-${f.facility_id}">${a.sessions.map(sessHtml).join('')}</div>
      <div class="card-foot">
        <span class="checked ${a.freshness === 'stale' ? 'stale' : ''}" id="chk-${f.facility_id}">
          ${a.freshness === 'stale' ? '⚠ 오래된 정보 · ' : ''}${checkedKst(a.checked_at)}
        </span>
        <button class="btn-refresh" data-refresh="${f.facility_id}" data-date="${date}" type="button">↻ 새로고침</button>
        ${f.reservation_url_verified
          ? `<a class="btn-official" href="${f.reservation_url}" target="_blank" rel="noopener">공식 예약 ↗</a>`
          : `<a class="btn-official weak" href="https://umppa.seoul.go.kr" target="_blank" rel="noopener">공식 포털 ↗</a>`}
      </div>
    </div>`;
  return el;
}

function sessHtml(s) {
  const sub = s.status === 'AVAILABLE' ? `데모 수치 ${s.displayed_number}` : '';
  return `<div class="sess s-${s.status}">${s.session_label} · ${STATUS_TEXT[s.status] || s.status}${sub ? `<small>${sub}</small>` : ''}</div>`;
}

async function search() {
  const p = new URLSearchParams();
  p.set('date', state.date);
  if (selected.size) p.set('districts', [...selected].join(','));
  const am = ageMonths();
  if (am != null) p.set('age_months', am);
  if (loc && radius) { p.set('lat', loc.lat); p.set('lng', loc.lng); p.set('radius_km', radius); }

  const bar = $('resultBar');
  bar.hidden = false;
  $('resSub').textContent = `조회 중… (${state.date})`;
  $('resCount').textContent = '';
  skeleton();
  let r;
  try { r = await fetch('/api/facilities?' + p); } catch { r = null; }
  if (!r || !r.ok) {
    list.innerHTML = `<div class="empty"><div class="big">😵</div><p>조회에 실패했어요.<br>잠시 후 다시 시도해주세요.</p></div>`;
    $('resSub').textContent = '오류 발생';
    return;
  }
  const data = await r.json();
  if (!data.results.length) {
    bar.hidden = true;
    list.innerHTML = `<div class="empty"><div class="big">🔍</div><p>조건에 맞는 시설이 없어요.<br>자치구나 나이를 바꿔서 다시 찾아볼까요?</p></div>`;
    return;
  }
  list.innerHTML = '';
  data.results.forEach((f) => list.appendChild(renderCard(f, data.date)));
  $('resCount').textContent = `${data.count}개`;
  $('resSub').textContent = `${state.date} 기준 · 데모 수치 · 마지막 확인 시각 KST`;
}

/* ── 새로고침 ── */
list.addEventListener('click', async (e) => {
  const b = e.target.closest('[data-refresh]');
  if (!b) return;
  const id = b.dataset.refresh, date = b.dataset.date;
  b.disabled = true; b.textContent = '↻ 갱신 중…';
  try {
    const r = await fetch(`/api/facilities/${id}/availability/refresh`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ date }),
    });
    const d = await r.json();
    if (r.status === 429) {
      b.textContent = `대기 ${d.retry_after_seconds}초`;
      setTimeout(() => { b.disabled = false; b.textContent = '↻ 새로고침'; }, (d.retry_after_seconds || 60) * 1000);
      return;
    }
    if (r.ok) {
      const chk = document.getElementById('chk-' + id);
      const sess = document.getElementById('sess-' + id);
      if (chk) {
        chk.textContent = (d.freshness === 'stale' ? '⚠ 오래된 정보 · ' : '') + checkedKst(d.checked_at);
        chk.className = 'checked' + (d.freshness === 'stale' ? ' stale' : '');
      }
      if (sess) sess.innerHTML = d.sessions.map(sessHtml).join('');
    }
  } catch { /* 기존 캐시 유지 */ }
  b.disabled = false; b.textContent = '↻ 새로고침';
});

initDistricts().then(search);
</script>
