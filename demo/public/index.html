<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>S-Kids 데모 — 서울형 키즈카페 통합 검색</title>
<style>
  :root {
    --bg: #f6f7fb; --card: #fff; --ink: #1c2333; --muted: #6b7280;
    --accent: #2563eb; --line: #e5e7eb;
    --ok: #16a34a; --full: #dc2626; --notopen: #2563eb;
    --closed: #6b7280; --unknown: #d97706; --stale: #9333ea;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  header { background: var(--card); border-bottom: 1px solid var(--line);
    padding: 14px 16px 10px; position: sticky; top: 0; z-index: 5; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .demo-banner { background: #fff7ed; border: 1px solid #fed7aa; color: #9a3412;
    border-radius: 8px; padding: 8px 10px; font-size: 12px; line-height: 1.5; margin-top: 6px; }
  .filters { padding: 10px 16px 4px; background: var(--card); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  label.lbl { font-size: 12px; color: var(--muted); margin-right: 2px; }
  select, input[type="date"] {
    border: 1px solid var(--line); border-radius: 8px; padding: 7px 8px;
    font-size: 13px; background: #fff; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid var(--line); background: #fff; border-radius: 999px;
    padding: 5px 10px; font-size: 12px; cursor: pointer; user-select: none; }
  .chip.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .chip.small { padding: 4px 9px; }
  .btn { border: none; background: var(--accent); color: #fff; border-radius: 8px;
    padding: 8px 14px; font-size: 13px; cursor: pointer; }
  .btn.ghost { background: #fff; color: var(--accent); border: 1px solid var(--accent); }
  .btn:disabled { opacity: .5; cursor: default; }
  #status { padding: 8px 16px; font-size: 12px; color: var(--muted); min-height: 20px; }
  #list { padding: 4px 16px 40px; display: grid; gap: 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px; }
  .card h2 { font-size: 15px; margin: 0; display: flex; justify-content: space-between; gap: 8px; }
  .dist { color: var(--muted); font-size: 13px; font-weight: 400; white-space: nowrap; }
  .meta { font-size: 12.5px; color: var(--muted); margin: 6px 0 10px; line-height: 1.55; }
  .sessions { display: flex; gap: 6px; flex-wrap: wrap; }
  .sess { border-radius: 8px; padding: 6px 9px; font-size: 12px; font-weight: 600;
    color: #fff; min-width: 66px; text-align: center; }
  .sess .num { display: block; font-weight: 400; font-size: 11px; opacity: .95; }
  .s-AVAILABLE { background: var(--ok); }
  .s-FULL { background: var(--full); }
  .s-NOT_OPEN { background: var(--notopen); }
  .s-CLOSED { background: var(--closed); }
  .s-UNKNOWN { background: var(--unknown); }
  .foot { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .checked { font-size: 11px; color: var(--muted); }
  .checked.stale { color: var(--stale); font-weight: 600; }
  .official { background: #0f766e; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; font-size: 14px; }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (min-width: 720px) { #list { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>
<header>
  <h1>S-Kids <span class="dist">데모</span></h1>
  <div>가까운 서울형 키즈카페를 찾고 회차별 현황을 비교합니다. 예약·결제는 공식 포털에서 진행됩니다.</div>
  <div class="demo-banner">
    <strong>데모 모드:</strong> 시설 목록과 예약 현황은 예시·시뮬레이션 데이터입니다.
    실제 예약 가능 인원이 아니며 '실시간'을 보장하지 않습니다.
    출처: 서울 열린데이터광장 시설현황정보 스키마 예시 (공공누리 제1유형, 출처 표기).
  </div>
</header>

<div class="filters">
  <div class="row">
    <label class="lbl for" for="date">날짜</label>
    <input type="date" id="date" />
    <button class="btn ghost" id="locBtn" type="button">내 위치 사용</button>
    <span class="lbl" id="locInfo">위치 없음 → 자치구 중심 기준 거리</span>
  </div>
  <div class="row" id="radiusRow">
    <label class="lbl" for="radius">반경</label>
    <select id="radius">
      <option value="">전체 (거리순)</option>
      <option value="1">1km</option><option value="3">3km</option>
      <option value="5">5km</option><option value="10">10km</option>
    </select>
  </div>
  <div class="row">
    <label class="lbl" for="ageYear">아이 나이</label>
    <select id="ageYear"><option value="">미지정</option></select>
    <select id="ageMonth" hidden><option value="0">0개월</option></select>
  </div>
  <div class="row" id="districtRow">
    <span class="lbl">자치구</span>
  </div>
  <div class="row">
    <button class="btn" id="searchBtn" type="button">검색</button>
    <button class="btn ghost" id="resetBtn" type="button">필터 초기화</button>
  </div>
</div>

<div id="status">검색을 시작하면 결과가 표시됩니다.</div>
<div id="list"></div>

<script>
const $ = (id) => document.getElementById(id);
const KST_OFFSET = 9 * 60; // 분
let districts = [];
let selectedDistricts = new Set();
let loc = null;

function kstDateInput(d) {
  const t = new Date(d.getTime() + KST_OFFSET * 60000);
  return t.toISOString().slice(0, 10);
}
$('date').value = kstDateInput(new Date());

// 나이 셀렉트 (0~12세)
const yearSel = $('ageYear'), monthSel = $('ageMonth');
for (let y = 0; y <= 12; y++) {
  yearSel.add(new Option(y + '세', y));
  if (y > 0) monthSel.add(new Option((y * 12) + '개월', y * 12));
}
yearSel.addEventListener('change', () => {
  const v = yearSel.value;
  if (v === '' || v === '0') { monthSel.hidden = true; monthSel.value = ''; }
  else { monthSel.hidden = false; monthSel.value = v * 12; }
});
function ageMonths() {
  const y = yearSel.value;
  if (y === '') return null;
  if (y === '0') return 0;
  return Number(monthSel.value);
}

async function init() {
  const r = await fetch('/api/districts');
  districts = (await r.json()).districts;
  const row = $('districtRow');
  districts.forEach((d) => {
    const c = document.createElement('button');
    c.type = 'button'; c.className = 'chip small'; c.textContent = d;
    c.addEventListener('click', () => {
      selectedDistricts.has(d) ? selectedDistricts.delete(d) : selectedDistricts.add(d);
      c.classList.toggle('on');
    });
    row.appendChild(c);
  });
}

function statusLabel(s) {
  switch (s) {
    case 'AVAILABLE': return '예약 가능';
    case 'FULL': return '마감';
    case 'NOT_OPEN': return '아직 예약 전';
    case 'CLOSED': return '휴관';
    default: return '확인 불가';
  }
}
function checkedAtKst(iso) {
  const d = new Date(iso);
  return d.toLocaleTimeString('ko-KR', { timeZone: 'Asia/Seoul', hour: '2-digit', minute: '2-digit' }) + ' 확인';
}

function render(f, date) {
  const a = f.availability;
  const el = document.createElement('div');
  el.className = 'card';

  const distText = f.distance_km == null ? '거리 미제공'
    : `${f.distance_km}km${f.distance_basis === 'district_centroid' ? ' (자치구 중심)' : ''}`;
  const ageLine = f.age_range
    ? `이용연령: ${f.age_range}${f.age_eligibility === 'review' ? ' (연령 확인 필요)' : ''}`
    : '이용연령: 확인 필요';

  const sessHtml = a.sessions.map((s) => {
    const num = s.status === 'AVAILABLE' ? `표시 수치 ${s.displayed_number}` : '';
    return `<div class="sess s-${s.status}">${s.session_label} · ${statusLabel(s.status)}${num ? `<span class="num">${num}</span>` : ''}</div>`;
  }).join('');

  const official = f.reservation_url_verified
    ? `<a class="btn official" href="${f.reservation_url}" target="_blank" rel="noopener">공식 예약하기 ↗</a>`
    : `<a class="btn ghost" href="https://umppa.seoul.go.kr" target="_blank" rel="noopener">공식 포털에서 찾기 ↗ <span style="font-size:11px">(미검증 링크)</span></a>`;

  el.innerHTML = `
    <h2>${f.name}<span class="dist">${f.district} · ${distText}</span></h2>
    <div class="meta">${ageLine}<br>${f.open_days} · ${f.address}</div>
    <div class="sessions">${sessHtml}</div>
    <div class="foot">
      <span class="checked ${a.freshness === 'stale' ? 'stale' : ''}" id="chk-${f.facility_id}">
        ${a.freshness === 'stale' ? '오래된 정보 · ' : ''}${checkedAtKst(a.checked_at)}
      </span>
      <button class="btn ghost" type="button" data-refresh="${f.facility_id}" data-date="${date}" style="padding:5px 10px;font-size:12px;">새로고침</button>
      ${official}
    </div>`;
  return el;
}

async function search() {
  const p = new URLSearchParams();
  if (selectedDistricts.size) p.set('districts', [...selectedDistricts].join(','));
  const am = ageMonths();
  if (am != null) p.set('age_months', am);
  const radius = $('radius').value;
  if (radius && loc) { p.set('lat', loc.lat); p.set('lng', loc.lng); p.set('radius_km', radius); }
  if (radius && !loc) $('status').textContent = '반경 필터는 "내 위치 사용" 후 적용됩니다. 현재 자치구 필터만 적용됩니다.';
  p.set('date', $('date').value);
  $('status').textContent = '조회 중… (캐시 5분, 데모 시뮬레이션)';
  const list = $('list'); list.innerHTML = '';
  const r = await fetch('/api/facilities?' + p);
  if (!r.ok) { $('status').textContent = '조회에 실패했습니다. 다시 시도해주세요.'; return; }
  const data = await r.json();
  if (!data.results.length) {
    list.innerHTML = '<div class="empty">조건에 맞는 시설이 없습니다. 필터를 조정해주세요.</div>';
    $('status').textContent = `${data.date} 기준 결과 0개`;
    return;
  }
  data.results.forEach((f) => list.appendChild(render(f, data.date)));
  $('status').textContent = `${data.date} 기준 ${data.count}개 시설 · 데모 데이터 · 마지막 확인 시각은 KST 기준`;
}

async function refreshFacility(facilityId, date) {
  const btn = document.querySelector(`[data-refresh="${facilityId}"]`);
  const chk = document.getElementById('chk-' + facilityId);
  btn.disabled = true; btn.textContent = '갱신 중…';
  try {
    const r = await fetch(`/api/facilities/${facilityId}/availability/refresh`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ date }),
    });
    const data = await r.json();
    if (r.status === 429) {
      btn.textContent = `대기 ${data.retry_after_seconds}초`;
      setTimeout(() => { btn.disabled = false; btn.textContent = '새로고침'; }, data.retry_after_seconds * 1000);
      return;
    }
    if (r.ok) {
      chk.textContent = (data.freshness === 'stale' ? '오래된 정보 · ' : '') + checkedAtKst(data.checked_at);
      chk.className = 'checked' + (data.freshness === 'stale' ? ' stale' : '');
      // 회차 표시 갱신
      const card = chk.closest('.card');
      card.querySelector('.sessions').innerHTML = data.sessions.map((s) =>
        `<div class="sess s-${s.status}">${s.session_label} · ${statusLabel(s.status)}` +
        (s.status === 'AVAILABLE' ? `<span class="num">표시 수치 ${s.displayed_number}</span>` : '') +
        `</div>`).join('');
    }
  } catch {
    /* 기존 캐시 유지 */
  }
  btn.disabled = false; btn.textContent = '새로고침';
}

$('list').addEventListener('click', (e) => {
  const b = e.target.closest('[data-refresh]');
  if (b) refreshFacility(b.dataset.refresh, b.dataset.date);
});

$('searchBtn').addEventListener('click', search);
$('resetBtn').addEventListener('click', () => {
  selectedDistricts.clear();
  document.querySelectorAll('#districtRow .chip').forEach((c) => c.classList.remove('on'));
  yearSel.value = ''; monthSel.hidden = true; $('radius').value = '';
  $('date').value = kstDateInput(new Date());
  loc = null; $('locInfo').textContent = '위치 없음 → 자치구 중심 기준 거리';
  search();
});
$('locBtn').addEventListener('click', () => {
  if (!navigator.geolocation) { $('locInfo').textContent = '이 브라우저는 위치 API를 지원하지 않습니다.'; return; }
  $('locInfo').textContent = '위치 확인 중…';
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      loc = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      $('locInfo').textContent = `위치 사용 중 (${loc.lat.toFixed(3)}, ${loc.lng.toFixed(3)})`;
    },
    () => { loc = null; $('locInfo').textContent = '거부됨 → 자치구 중심 기준 거리'; }
  );
});

init().then(search);
</script>
</body>
</html>
